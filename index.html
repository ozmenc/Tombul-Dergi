<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tombul Dergi</title>
    <meta name="description" content="Tombul Dergi: oku, beğen, yorum yap, sen de yaz." />
    <meta name="theme-color" content="#f4f2ed" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Tema, sayfa çizilmeden önce: kayıtlı seçim, yoksa sistem.
      try { var t = localStorage.getItem("tombul-tema"); document.documentElement.dataset.theme = t === "dark" || t === "light" ? t : matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tombul Dergi'yi okumak için JavaScript'i aç.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
